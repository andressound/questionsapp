services:
  postgres:
    image: postgres:17-alpine
    container_name: questionsapp-pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-questionsapp}
      POSTGRES_USER: ${DB_USER:-questionsapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-questionsapp_local_password}
      POSTGRES_INITDB_ARGS: --encoding=UTF8
      TZ: ${TZ:-UTC}
      PGTZ: ${TZ:-UTC}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - questionsapp_pg_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  questionsapp_pg_data:
